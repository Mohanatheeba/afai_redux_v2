version: "3.8"

services:
  # Document conversion: parsing, OCR, VLM, table extraction
  docling-serve:
    image: ghcr.io/docling-project/docling-serve:v1.16.1
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_PORT=5001
      - DOCLING_SERVE_MAX_SYNC_WAIT=600
    volumes:
      - docling-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chunking + metadata enrichment
  afai-redux:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DOCLING_SERVE_URL=http://docling-serve:5001
      - DOCLING_SERVE_TIMEOUT=300
    depends_on:
      docling-serve:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  docling-cache:
