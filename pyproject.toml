[project]
name = "afai-redux"
version = "0.1.0"
description = "Document ingestion service for the AF AI Helper co-pilot. Delegates parsing to docling-serve; owns chunking, metadata enrichment, and the chunk contract with AeroChat."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "docling>=2.88",       # needed for docling.chunking.HybridChunker + docling_core types
  "httpx>=0.27",         # HTTP client for docling-serve
  "python-multipart>=0.0.9",
]
# NOTE: We import only docling.chunking (HybridChunker) and docling_core
# (DoclingDocument types). The heavy parser backends (Torch, EasyOCR, etc.)
# are NOT loaded at runtime — all parsing happens on docling-serve.
# If a future docling release allows installing chunking without the parser
# deps, we should switch to that lighter install.

[project.optional-dependencies]
# Batch watcher layer — only needed when running `python -m batch.cli`
# or otherwise using the batch package. The FastAPI service itself
# does not depend on these.
batch = [
  "psycopg2-binary>=2.9",           # ledger / staging / cursor tables
  "google-api-python-client>=2.0",  # Google Drive adapter
  "google-auth>=2.0",               # service-account credentials
]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
afai-batch-sweep = "batch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "batch*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
